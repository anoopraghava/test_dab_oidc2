bundle:
  name: simple_demo_bundle2

resources:
  jobs:
    hello_world_job3:
      name: "hello-world-job2-${bundle.target}"
      tasks:
        - task_key: run_python_script
          spark_python_task:
            python_file: src/main.py
          # Using serverless compute for simplicity (no cluster waiting time)
          # If your workspace doesn't have serverless, replace this with a 'new_cluster' block
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "1"

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Replace with your actual Azure Databricks Workspace URL
      host: https://adb-7405615693561461.1.azuredatabricks.net